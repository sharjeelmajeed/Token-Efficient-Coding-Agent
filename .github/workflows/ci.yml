name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: clients/vscode
      - run: npm run compile
        working-directory: clients/vscode
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: coverage run --branch --source=token_agent -m pytest
      - run: coverage report --include=src/token_agent/policy.py --fail-under=80
      - run: pip-audit --skip-editable
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: clients/vscode
      - run: npm test
        working-directory: clients/vscode
      - run: npm audit
        working-directory: clients/vscode
      - run: npm run package
        working-directory: clients/vscode
      - run: xvfb-run -a npm run test:host
        working-directory: clients/vscode
