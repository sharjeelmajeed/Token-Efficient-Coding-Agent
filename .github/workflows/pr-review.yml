name: Read-only agent review
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
concurrency:
  group: token-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: vars.AGENT_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install trusted base application
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Analyze bounded PR data through the shared core
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIFROST_VIRTUAL_KEY: ${{ secrets.BIFROST_REVIEW_VIRTUAL_KEY }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_OUTPUT: ${{ runner.temp }}/token-agent-output/review.json
        run: >-
          python -m token_agent.pr_review review --config agent.review.toml
          --repository "$REVIEW_REPOSITORY" --number "$REVIEW_NUMBER" --output "$REVIEW_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-agent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/token-agent-output/review.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: review
    if: vars.AGENT_REVIEW_POST_COMMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install trusted publisher
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: token-agent-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/token-agent-output
      - name: Publish completed review only for its unchanged PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ github.repository }}
          REVIEW_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_REPORT: ${{ runner.temp }}/token-agent-output/review.json
        run: >-
          python -m token_agent.pr_review publish --report "$REVIEW_REPORT"
          --repository "$REVIEW_REPOSITORY" --number "$REVIEW_NUMBER"
