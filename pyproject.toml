[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "token-efficient-coding-agent"
version = "0.3.0"
description = "A policy-enforced, token-efficient coding agent for the confirmed hackathon FSD"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "typer==0.27.3",
  "rich>=14,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "pip-audit>=2,<3", "setuptools>=80", "coverage>=7,<9"]

[project.scripts]
agent = "token_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]

